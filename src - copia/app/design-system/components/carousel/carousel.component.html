<div
  class="carousel"
  (mousedown)="startDrag($event)"
  (mouseup)="endDrag()"
  (mouseleave)="endDrag()"
  (mousemove)="drag($event)"
  (mouseenter)="stopAutoplay()"
  (mouseleave)="startAutoplay()"
>
  <button
    class="carousel-control prev"
    (click)="rotateRight()"
    [disabled]="isPrevDisabled"
  >
    &lt;
  </button>
  <div class="carousel-track" #track>
    <div
      class="carousel-item"
      *ngFor="let photo of currentPhotos; let i = index"
    >
      <img
        [src]="photo"
        [alt]="'Imagen ' + (i + 1)"
        class="carousel-image"
        (mouseenter)="setHoveredImageIndex(i)"
        (mouseleave)="clearHoveredImageIndex()"
      />
    </div>
  </div>
  <button
    class="carousel-control next"
    (click)="rotateLeft()"
    [disabled]="isNextDisabled"
  >
    &gt;
  </button>
  <button class="carousel-control pause" (click)="togglePause()">
    {{ isPaused ? "Play" : "Pause" }}
  </button>
  <div class="carousel-dots">
    <button
      *ngFor="let photo of photos; let i = index"
      class="dot"
      [class.active]="i === currentIndex"
      (click)="goToImage(i)"
    ></button>
  </div>
</div>
