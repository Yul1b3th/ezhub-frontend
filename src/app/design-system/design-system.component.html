<section class="form-section" aria-labelledby="form-heading">
  <h2 id="form-heading">Formulario Completo</h2>
  <form>
    <div class="form-group">
      <label for="name">Nombre</label>
      <input
        type="text"
        id="name"
        class="input-text"
        placeholder="Ingrese su nombre"
        aria-required="true"
      />
    </div>

    <div class="form-group">
      <label for="email">Correo Electrónico</label>
      <input
        type="email"
        id="email"
        class="input-text"
        placeholder="Ingrese su correo electrónico"
        aria-required="true"
      />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <input
        type="password"
        id="password"
        class="input-text"
        placeholder="Ingrese su contraseña"
        aria-required="true"
      />
    </div>

    <div class="form-group">
      <label for="phone">Teléfono</label>
      <input
        type="tel"
        id="phone"
        class="input-text"
        placeholder="Ingrese su teléfono"
        aria-required="false"
      />
    </div>

    <div class="form-group">
      <label for="date">Fecha</label>
      <input type="date" id="date" class="input-text" aria-required="false" />
    </div>

    <div class="form-group">
      <label for="time">Hora</label>
      <input type="time" id="time" class="input-text" aria-required="false" />
    </div>

    <div class="form-group">
      <label for="datetime">Fecha y Hora</label>
      <input
        type="datetime-local"
        id="datetime"
        class="input-text"
        aria-required="false"
      />
    </div>

    <div class="form-group">
      <label for="url">URL</label>
      <input
        type="url"
        id="url"
        class="input-text"
        placeholder="Ingrese una URL"
        aria-required="false"
      />
    </div>

    <div class="form-group">
      <label for="number">Número</label>
      <input
        type="number"
        id="number"
        class="input-text"
        placeholder="Ingrese un número"
        aria-required="false"
      />
    </div>

    <div class="form-group">
      <label for="range">Rango</label>
      <input
        type="range"
        id="range"
        class="input-range"
        min="0"
        max="100"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-required="false"
      />
    </div>

    <div class="form-group">
      <label for="color">Color</label>
      <input
        type="color"
        id="color"
        class="input-color"
        aria-required="false"
      />
    </div>

    <div class="form-group">
      <label for="message">Mensaje</label>
      <textarea
        id="message"
        class="textarea"
        placeholder="Ingrese su mensaje"
        aria-required="false"
      ></textarea>
    </div>

    <div class="form-group">
      <label for="options">Opciones</label>
      <select id="options" class="select" aria-required="false">
        <option value="">Seleccione una opción</option>
        <option value="1">Opción 1</option>
        <option value="2">Opción 2</option>
        <option value="3">Opción 3</option>
      </select>
    </div>

    <div class="form-group">
      <input type="checkbox" id="subscribe" class="checkbox" />
      <label for="subscribe">Suscribirse al boletín</label>
    </div>

    <fieldset class="form-group">
      <legend>Opciones de radio</legend>
      <div>
        <input type="radio" id="option1" name="radio-group" class="radio" />
        <label for="option1">Opción 1</label>
      </div>
      <div>
        <input type="radio" id="option2" name="radio-group" class="radio" />
        <label for="option2">Opción 2</label>
      </div>
    </fieldset>

    <div class="form-group">
      <label for="file">Archivo</label>
      <input type="file" id="file" class="input-file" aria-required="false" />
    </div>

    <div class="form-group">
      <label for="form-switch">Activar opción</label>
      <div class="form-switch">
        <input
          type="checkbox"
          id="form-switch"
          class="form-switch-checkbox"
          aria-required="false"
        />
        <label class="form-switch-label" for="form-switch">
          <span class="form-switch-inner"></span>
          <span class="form-switch-switch"></span>
        </label>
      </div>
    </div>

    <ds-button btnClass="btn-primary" type="submit">Enviar</ds-button>
  </form>
</section>
