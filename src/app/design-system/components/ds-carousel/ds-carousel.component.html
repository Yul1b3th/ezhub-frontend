<!-- carousel.component.html -->
<div class="carousel">
  <div class="carousel-inner">
    <div
      *ngFor="let slide of slides; let i = index"
      class="carousel-item"
      [class.active]="i === currentSlide"
      [style.backgroundColor]="slide.color"
    >
      <div class="carousel-content">
        {{ slide.content }}
      </div>
    </div>
  </div>
</div>
