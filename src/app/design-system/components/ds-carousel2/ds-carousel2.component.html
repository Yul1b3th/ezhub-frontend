<div class="carousel-container">
  <div class="carousel-inner" #track>
    <div class="carousel-item" *ngFor="let item of items; let i = index">
      <img [src]="item" [alt]="item" class="carousel-image" />
    </div>
  </div>
  <button class="carousel-control prev" (click)="prev()">&#10094;</button>
  <button class="carousel-control next" (click)="next()">&#10095;</button>
</div>
