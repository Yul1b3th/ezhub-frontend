<div
  id="carouselExampleCaptions"
  class="carousel slide carousel-container"
  (mouseenter)="stopAutoplay()"
  (mouseleave)="startAutoplay()"
>
  <div class="carousel-indicators">
    <button
      *ngFor="let photo of photos; let i = index"
      type="button"
      [class.active]="i === currentIndex"
      aria-current="true"
      [attr.aria-label]="'Slide ' + (i + 1)"
      (click)="goToSlide(i)"
    ></button>
  </div>
  <div
    class="carousel-inner"
    (mousedown)="startDrag($event)"
    (mousemove)="drag($event)"
    (mouseup)="endDrag()"
    (mouseleave)="endDrag()"
  >
    <div
      *ngFor="let photo of photos; let i = index"
      class="carousel-item"
      [class.active]="i === currentIndex"
      #carouselItem
    >
      <img [src]="photo" class="d-block w-100" alt="Slide {{ i + 1 }}" />
      <div class="carousel-caption d-none d-md-block">
        <h5>Slide {{ i + 1 }} label</h5>
        <p>Some representative placeholder content for slide {{ i + 1 }}.</p>
      </div>
    </div>
  </div>
  <button class="carousel-control-prev" type="button" (click)="prevSlide()">
    <span class="visually-hidden">&#10094;</span>
  </button>
  <button class="carousel-control-next" type="button" (click)="nextSlide()">
    <span class="visually-hidden">&#10095;</span>
  </button>
  <div class="carousel-controls">
    <button (click)="toggleAutoplay()">
      {{ isPlaying ? "Pause" : "Play" }}
    </button>
  </div>
</div>
